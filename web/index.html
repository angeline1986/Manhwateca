<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manhwateca Workspace</title>
 <link rel="stylesheet" href="/css/app.css">
  <!-- Favicon e Fontes se desejar adicionar aqui -->
</head>
<body class="sidebar-collapsed">
  <div class="app-shell">
    
    <!-- MENU LATERAL (FIXO) -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">M</span>
        <div class="brand-copy">
          <strong>Manhwa<span>teca</span></strong>
          <small>Rose Edition</small>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" type="button"
                aria-label="Recolher menu lateral" aria-expanded="true">
          ‹
        </button>
      </div>

      <nav class="main-nav" aria-label="Navegação principal">
        <button class="nav-link" data-page="flows">
          <span class="nav-icon">▶</span><span>Fluxos</span>
        </button>
        <button class="nav-link" data-page="overview">
          <span class="nav-icon">⌂</span><span>Dashboard</span>
        </button>
        <button class="nav-link" data-page="library">
          <span class="nav-icon">▤</span><span>Biblioteca</span>
        </button>
        <button class="nav-link" data-page="organization">
          <span class="nav-icon">◇</span><span>Organização</span>
        </button>
        <button class="nav-link" data-page="mangaupdates">
          <span class="nav-icon">⌕</span><span>MangaUpdates</span>
        </button>
        <button class="nav-link" data-page="notion">
          <span class="nav-icon">↻</span><span>Notion</span>
        </button>
        <button class="nav-link" data-page="automation">
          <span class="nav-icon">▶</span><span>Automação</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-link" data-page="settings">
          <span class="nav-icon">⚙</span><span>Configurações</span>
        </button>
        <span class="local-badge">Somente local</span>
      </div>
    </aside>

    <!-- ÁREA DE TRABALHO -->
    <main class="workspace">
      
      <!-- CABEÇALHO (DINÂMICO) -->
      <header class="topbar" id="topbar">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menu">☰</button>
        <div>
          <span class="eyebrow" id="pageEyebrow">CARREGANDO</span>
          <h1 id="pageTitle">Iniciando...</h1>
          <p id="pageSubtitle">Aguarde enquanto preparamos o seu workspace.</p>
        </div>
        <button class="topbar-action" id="refresh" type="button" hidden>
          Recarregar Dash
        </button>
      </header>

      <!-- CONTAINER DE INJEÇÃO DE PÁGINAS -->
      <div id="page-content">
        <!-- O conteúdo das views/*.html será carregado aqui -->
        <div class="page-container">
          <div class="empty">Carregando módulos...</div>
        </div>
      </div>
      
    </main>
  </div>

  <!-- COMPONENTES GLOBAIS (Sempre disponíveis) -->
  
  <!-- Toast de Tarefas -->
  <div class="task-toast" id="taskToast" hidden>
    <div class="task-toast-content">
      <strong id="taskToastTitle">Tarefa iniciada</strong>
      <span id="taskToastText">Acompanhe o andamento no histórico.</span>
      <div class="task-progress" id="taskProgress" aria-label="Tarefa em andamento">
        <span></span>
      </div>
    </div>
    <a id="taskResultLink" href="#" target="_blank" hidden>Abrir relatório</a>
    <button type="button" id="viewTaskProgress">Ver andamento</button>
  </div>

  <!-- Diálogo de Confirmação -->
  <dialog class="confirmation-dialog" id="confirmationDialog">
    <form method="dialog">
      <span class="eyebrow">CONFIRMAÇÃO</span>
      <h2 id="confirmationTitle">Confirmar operação</h2>
      <p id="confirmationText"></p>
      <div class="confirmation-actions">
        <button class="ghost-button" type="submit" value="cancel">Cancelar</button>
        <button type="submit" value="confirm" class="primary-action">Confirmar</button>
      </div>
    </form>
  </dialog>

  <!-- SCRIPT PRINCIPAL (TIPO MÓDULO) -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
